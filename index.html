<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>broccoli.log</title>
    <meta
      name="description"
      content="broccoli — frontend engineer. A retro top-down self-introduction game."
    />
    <meta name="theme-color" content="#1b1424" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main id="app">
      <section id="stage" aria-label="broccoli.log game">
        <canvas id="screen" aria-hidden="true"></canvas>
        <div id="hud-box">
          <div id="hud" aria-live="polite"></div>
          <button id="quest" type="button"></button>
        </div>
        <div id="focus-ring" aria-hidden="true"></div>
        <nav id="topbar">
          <button id="map-btn" type="button" class="is-primary"></button>
          <button id="tldr-btn" type="button"></button>
          <button id="lang-btn" type="button"></button>
        </nav>
        <div id="toast" role="status" hidden></div>
        <div id="keys" aria-hidden="true" hidden>
          <span id="keys-talk" hidden></span>
          <span id="keys-controls"></span>
        </div>
        <div id="dialog" role="dialog" hidden></div>
        <div id="coach" class="overlay" role="dialog" hidden></div>
        <div id="title" class="overlay">
          <h1 class="title-logo">broccoli<span>.log</span></h1>
          <p id="title-subtitle"></p>
          <div class="title-lang" role="group">
            <button type="button" data-lang="ko">한국어</button>
            <button type="button" data-lang="en">English</button>
          </div>
          <button id="start-btn" type="button" class="title-start"></button>
          <button id="title-map-btn" type="button" class="title-map"></button>
          <p id="title-hint" class="title-hint"></p>
        </div>
      </section>
      <section id="touch" aria-label="touch controls">
        <div class="dpad">
          <button type="button" data-dir="up" aria-label="up">▲</button>
          <button type="button" data-dir="left" aria-label="left">◀</button>
          <button type="button" data-dir="right" aria-label="right">▶</button>
          <button type="button" data-dir="down" aria-label="down">▼</button>
        </div>
        <div class="ab">
          <button type="button" data-btn="b" aria-label="B">B</button>
          <button type="button" data-btn="a" aria-label="A">A</button>
        </div>
      </section>
      <div id="map" class="overlay tldr" role="dialog" hidden></div>
      <div id="tldr" class="overlay tldr" role="dialog" hidden></div>
      <div id="detail" class="overlay tldr" role="dialog" hidden></div>
    </main>
    <noscript>
      <p>
        broccoli — frontend engineer since 2015. React Native · Expo ·
        TypeScript.
        <a href="https://github.com/broccoliInDB">github.com/broccoliInDB</a>
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
